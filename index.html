        <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

        <meta http-equiv="cache-control" content="no-cache" />

        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #3E6FD9;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #3E6FD9;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #E4E5E8;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            .staticrypt-html {
                font-size: 16px;
            }

            .staticrypt-body {
                color: #2e3037;
                font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
                background-color: #e4e5e8;
                background-image: linear-gradient(135deg, rgba(255,255,255,.18), transparent 45%);
            }

            .staticrypt-page {
                width: min(90vw, 440px);
                padding-top: 11vh;
            }

            .staticrypt-form {
                max-width: 440px;
                overflow: visible;
                padding: 3rem 2.2rem 2.3rem 3.5rem;
                border: 1px solid #d9dadf;
                border-radius: .75rem;
                background-color: #fafafa;
                background-image:
                    linear-gradient(90deg, transparent 0 2.3rem, #f0a6b0 2.3rem 2.4rem, transparent 2.4rem),
                    linear-gradient(#d9dce1 1px, transparent 1px);
                background-position: 0 0, 0 .55rem;
                background-size: 100% 100%, 100% 1.85rem;
                box-shadow: 0 .5rem 1.8rem rgba(0,0,0,.16);
            }

            .staticrypt-form::before {
                content: "";
                position: absolute;
                top: -.7rem;
                left: 50%;
                width: 5rem;
                height: 1.35rem;
                margin-left: -2.5rem;
                background: rgba(255,236,150,.9);
                box-shadow: 0 1px 2px rgba(0,0,0,.1);
                transform: rotate(-2deg);
            }

            .staticrypt-title {
                margin-bottom: .3rem;
                color: #2e3037;
                font-size: 1.65rem;
                font-weight: 700;
                line-height: 1.25;
            }

            .staticrypt-instructions p:last-child {
                margin-top: .3rem;
                color: #6b6e76;
            }

            .staticrypt-password-container {
                overflow: hidden;
                border: 2px solid #d9dadf;
                border-radius: .65rem;
                background: rgba(255,255,255,.94);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                border-radius: .65rem;
                font-weight: 700;
                text-transform: none;
            }

            label.staticrypt-remember {
                color: #6b6e76;
                font-size: .82rem;
            }

            @media (max-width: 520px) {
                .staticrypt-page { padding-top: 7vh; }
                .staticrypt-form { padding: 2.7rem 1.35rem 2rem 2.9rem; }
            }
        </style>
    </head>

                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
